version: '3.8'

services:
  vhs-irc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vhs-irc
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VHS_IRC_REDIRECT_URI=${VHS_IRC_REDIRECT_URI:-http://localhost:3000/oauth/callback}
    volumes:
      # Persist SQLite database and uploaded files
      - vhs-irc-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/auth/me', (r) => r.statusCode === 401 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vhs-irc-data:
